<text x="40" y="412" font-family="'PingFang SC','Hiragino Sans GB',Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">铁路与港口的内部分部收入已抵销；不能按外部收入占比判断其全部价值。</text>
<text x="40" y="439" font-family="'PingFang SC','Hiragino Sans GB',Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">来源：中国神华 2026 年中报，分部附注。</text>
