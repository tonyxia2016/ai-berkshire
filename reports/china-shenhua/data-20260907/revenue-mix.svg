<text x="150.83551434674823" y="265" font-family="'PingFang SC','Hiragino Sans GB',Arial,sans-serif" font-size="15" fill="#334155" text-anchor="start" font-weight="400">0.66%  ·  12.49</text>
<text x="40" y="308" font-family="'PingFang SC','Hiragino Sans GB',Arial,sans-serif" font-size="16" fill="#334155" text-anchor="start" font-weight="400">航运</text>
