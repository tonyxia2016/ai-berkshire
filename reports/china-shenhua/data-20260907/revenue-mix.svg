<text x="40" y="75" font-family="'PingFang SC','Hiragino Sans GB',Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">2026H1 外部收入结构｜合并抵销后｜金额：人民币亿元</text>
<text x="40" y="136" font-family="'PingFang SC','Hiragino Sans GB',Arial,sans-serif" font-size="16" fill="#334155" text-anchor="start" font-weight="400">煤炭</text>
